[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-early-warning"
version = "0.1.0"
description = "Portfolio-grade sepsis early-warning ML project with patient-grouped validation, calibration, and alert-policy analysis."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Project maintainer" }
]
keywords = [
  "machine-learning",
  "data-science",
  "healthcare",
  "sepsis",
  "time-series",
  "calibration",
  "portfolio"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.24,<3.0",
  "pandas>=2.0,<3.0",
  "scikit-learn>=1.3,<2.0",
  "matplotlib>=3.7,<4.0",
  "pyarrow>=12,<18",
  "jupyterlab>=4.0,<5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
